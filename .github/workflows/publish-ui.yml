name: Build & Deploy agent-ui

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # Build standalone app (index.html + JS bundle)
      - run: npm run build

      # Build library module (agent-ui.js for CDN import)
      - run: npm run build:lib

      # Upload library JS to R2 for CDN
      - name: Upload agent-ui.js to R2
        run: |
          aws s3 cp dist-lib/agent-ui.js s3://shared-js-libraries/agent-ui.js \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --content-type "application/javascript"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

      # Deploy standalone app to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages project create agent-ui --production-branch main 2>/dev/null || true
          npx wrangler pages deploy ui/dist --project-name=agent-ui
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
